<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>My Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f7f6f3; --surface: #ffffff; --surface2: #f1efea;
  --border: #e3e1d9; --border2: #ccc9be;
  --text: #1a1915; --text2: #6b6860; --text3: #9b9890;
  --accent: #4a6fa5; --accent-light: #edf0f7;
  --sidebar-w: 220px; --header-h: 56px; --bottom-nav-h: 64px;
  --radius: 10px; --radius-sm: 6px;
  --font: 'DM Sans', sans-serif; --font-serif: 'DM Serif Display', serif;
  --tag-done-bg: #e6f4ec; --tag-done: #286742;
  --tag-inprog-bg: #fff4e0; --tag-inprog: #8a5a00;
  --tag-todo-bg: #f0eefc; --tag-todo: #4b3faf;
  --tag-plan-bg: #fdecea; --tag-plan: #a0291f;
  --tag-high-bg: #fdecea; --tag-high: #a0291f;
  --tag-med-bg: #fff4e0; --tag-med: #8a5a00;
  --tag-low-bg: #e6f4ec; --tag-low: #286742;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #191816; --surface: #242220; --surface2: #2d2b28;
    --border: #3a3835; --border2: #4a4845;
    --text: #f0ede6; --text2: #a09d96; --text3: #6b6860;
    --accent: #7da4d6; --accent-light: #1e2633;
    --tag-done-bg: #1a2e20; --tag-done: #78d49a;
    --tag-inprog-bg: #2d220a; --tag-inprog: #f5c060;
    --tag-todo-bg: #1e1a38; --tag-todo: #a99cef;
    --tag-plan-bg: #2d1210; --tag-plan: #f28a84;
    --tag-high-bg: #2d1210; --tag-high: #f28a84;
    --tag-med-bg: #2d220a; --tag-med: #f5c060;
    --tag-low-bg: #1a2e20; --tag-low: #78d49a;
  }
}

html, body { height: 100%; }
body { font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.6; display: flex; overflow: hidden; }

/* SIDEBAR */
.sidebar {
  width: var(--sidebar-w); min-width: var(--sidebar-w); height: 100vh;
  background: var(--surface2); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 16px 0; overflow-y: auto; flex-shrink: 0;
}
.sidebar-logo { padding: 0 16px 16px; display: flex; align-items: center; gap: 8px; }
.sidebar-logo .dot { width: 24px; height: 24px; border-radius: 6px; background: var(--accent); display: flex; align-items: center; justify-content: center; }
.sidebar-logo .dot span { color: #fff; font-weight: 600; font-size: 12px; }
.sidebar-logo h2 { font-family: var(--font-serif); font-size: 15px; font-weight: 400; color: var(--text); }
.sidebar-section { padding: 0 8px; margin-bottom: 4px; }
.sidebar-label { font-size: 11px; font-weight: 600; color: var(--text3); letter-spacing: 0.08em; text-transform: uppercase; padding: 8px 8px 4px; }
.sidebar-item { display: flex; align-items: center; gap: 8px; padding: 8px; border-radius: var(--radius-sm); cursor: pointer; color: var(--text2); font-size: 13px; transition: background 0.1s, color 0.1s; user-select: none; }
.sidebar-item:hover { background: var(--border); color: var(--text); }
.sidebar-item.active { background: var(--accent-light); color: var(--accent); font-weight: 500; }
.sidebar-item .icon { font-size: 16px; width: 20px; text-align: center; flex-shrink: 0; }

/* MAIN */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }

/* TOPBAR */
.topbar {
  height: var(--header-h); min-height: var(--header-h);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 16px; background: var(--surface);
}
.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.topbar-title { font-family: var(--font-serif); font-size: 18px; font-weight: 400; white-space: nowrap; }
.topbar-date { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar-right { display: flex; gap: 8px; flex-shrink: 0; }

.btn { padding: 6px 14px; border-radius: var(--radius-sm); border: 1px solid var(--border2); background: var(--surface); color: var(--text2); font-size: 12px; font-family: var(--font); cursor: pointer; transition: all 0.1s; white-space: nowrap; }
.btn:hover { background: var(--surface2); color: var(--text); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { opacity: 0.88; }

/* CONTENT */
.content { flex: 1; overflow-y: auto; padding: 24px 28px; -webkit-overflow-scrolling: touch; }

/* BOTTOM NAV */
.bottom-nav {
  display: none; position: fixed; bottom: 0; left: 0; right: 0;
  height: var(--bottom-nav-h); background: var(--surface);
  border-top: 1px solid var(--border); z-index: 50;
  padding-bottom: env(safe-area-inset-bottom);
}
.bottom-nav-inner { display: flex; height: 100%; }
.bottom-nav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 3px; cursor: pointer; color: var(--text3); transition: color 0.15s;
  user-select: none; -webkit-tap-highlight-color: transparent; padding: 8px 0;
}
.bottom-nav-item.active { color: var(--accent); }
.bottom-nav-item .nav-icon { font-size: 20px; line-height: 1; }
.bottom-nav-item .nav-label { font-size: 10px; font-weight: 600; letter-spacing: 0.03em; }

/* FAB */
.fab {
  display: none; position: fixed;
  bottom: calc(var(--bottom-nav-h) + env(safe-area-inset-bottom) + 16px); right: 18px;
  width: 54px; height: 54px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  font-size: 26px; font-family: var(--font); line-height: 1;
  cursor: pointer; align-items: center; justify-content: center;
  box-shadow: 0 4px 18px rgba(74,111,165,0.38); z-index: 51;
  transition: transform 0.15s; -webkit-tap-highlight-color: transparent;
}
.fab:active { transform: scale(0.91); }

/* SECTION HEADER */
.section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.section-title { font-size: 12px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.07em; }
.section-count { font-size: 11px; color: var(--text3); background: var(--surface2); padding: 2px 8px; border-radius: 20px; }

/* TASK LIST */
.task-list { display: flex; flex-direction: column; gap: 6px; }
.task-row {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer; transition: border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.task-row:hover { border-color: var(--border2); }
.task-check {
  width: 22px; height: 22px; min-width: 22px; border-radius: 6px;
  border: 1.5px solid var(--border2); cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.task-check.done { background: var(--accent); border-color: var(--accent); }
.task-check.done::after { content: '✓'; color: #fff; font-size: 12px; }
.task-row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.task-title { font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-title.done { text-decoration: line-through; color: var(--text3); }
.task-meta { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; }
.task-project { font-size: 11px; color: var(--text3); }

/* MEETING LIST */
.meeting-list { display: flex; flex-direction: column; gap: 8px; }
.meeting-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius);
  cursor: pointer; transition: border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.meeting-row:hover { border-color: var(--border2); }
.meeting-time-col { min-width: 58px; text-align: right; flex-shrink: 0; padding-top: 2px; }
.meeting-time { font-size: 12px; font-weight: 500; color: var(--accent); }
.meeting-date-sm { font-size: 10px; color: var(--text3); }
.meeting-divider { width: 1px; background: var(--border); align-self: stretch; flex-shrink: 0; }
.meeting-body { flex: 1; min-width: 0; }
.meeting-title { font-size: 14px; font-weight: 500; color: var(--text); }
.meeting-meta { font-size: 12px; color: var(--text3); margin-top: 4px; display: flex; gap: 10px; flex-wrap: wrap; }

/* PROJECT CARDS */
.project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.project-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; display: flex; flex-direction: column; gap: 12px;
  cursor: pointer; transition: border-color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.project-card:hover { border-color: var(--border2); }
.project-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
.project-name { font-size: 14px; font-weight: 500; color: var(--text); }
.project-desc { font-size: 12px; color: var(--text3); line-height: 1.5; }
.progress-bar { height: 5px; background: var(--border); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width 0.4s; }
.project-footer { display: flex; align-items: center; justify-content: space-between; }
.project-deadline { font-size: 11px; color: var(--text3); }

/* TAGS */
.tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 20px; font-size: 11px; font-weight: 500; white-space: nowrap; }
.tag.done   { background: var(--tag-done-bg);   color: var(--tag-done); }
.tag.inprog { background: var(--tag-inprog-bg); color: var(--tag-inprog); }
.tag.todo   { background: var(--tag-todo-bg);   color: var(--tag-todo); }
.tag.plan   { background: var(--tag-plan-bg);   color: var(--tag-plan); }
.tag.high   { background: var(--tag-high-bg);   color: var(--tag-high); }
.tag.med    { background: var(--tag-med-bg);    color: var(--tag-med); }
.tag.low    { background: var(--tag-low-bg);    color: var(--tag-low); }

/* FILTER BAR */
.filter-bar { display: flex; gap: 6px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
.filter-btn { padding: 5px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text2); font-size: 12px; cursor: pointer; font-family: var(--font); transition: all 0.1s; white-space: nowrap; }
.filter-btn:hover, .filter-btn.active { background: var(--accent-light); color: var(--accent); border-color: var(--accent); }
.search-input { padding: 7px 12px; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 14px; font-family: var(--font); outline: none; flex: 1; min-width: 100px; }
.search-input:focus { border-color: var(--accent); }

/* EMPTY / LOADING */
.empty { text-align: center; padding: 48px 20px; color: var(--text3); font-size: 13px; }
.loading { text-align: center; padding: 60px 20px; }
.spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* MODAL — slides up from bottom on mobile, centered on desktop */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.45);
  display: none; z-index: 200;
  align-items: flex-end; justify-content: center;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface); width: 100%; max-width: 560px;
  border-radius: 20px 20px 0 0;
  padding: 20px 20px calc(24px + env(safe-area-inset-bottom));
  max-height: 92vh; overflow-y: auto;
  animation: slideUp 0.22s ease;
}
@keyframes slideUp { from { transform: translateY(32px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-handle { width: 36px; height: 4px; background: var(--border2); border-radius: 2px; margin: 0 auto 18px; }
.modal h3 { font-family: var(--font-serif); font-size: 18px; margin-bottom: 18px; }
.form-row { margin-bottom: 14px; }
.form-row label { display: block; font-size: 11px; font-weight: 600; color: var(--text2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.05em; }
.form-row input, .form-row select, .form-row textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border2); border-radius: var(--radius-sm); background: var(--bg); color: var(--text); font-size: 15px; font-family: var(--font); outline: none; }
.form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--accent); }
.form-row textarea { resize: vertical; min-height: 80px; }
.form-row select option { background: var(--surface); }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.modal-actions .btn { flex: 1; padding: 12px; font-size: 14px; text-align: center; border-radius: var(--radius); }

/* RESPONSIVE */
@media (max-width: 680px) {
  .sidebar { display: none; }
  .bottom-nav { display: block; }
  .fab { display: flex; }
  .topbar-right { display: none; }
  .content { padding: 12px 12px calc(var(--bottom-nav-h) + 88px); }
  .project-grid { grid-template-columns: 1fr; }
  .topbar-date { display: none; }
  .topbar { padding: 0 14px; }
}

@media (min-width: 681px) {
  .modal { border-radius: var(--radius); margin: auto; }
  .modal-overlay { align-items: center; }
  .modal-handle { display: none; }
  .topbar { padding: 0 28px; }
}
</style>
</head>
<body>

<!-- Sidebar (desktop) -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="dot"><span>H</span></div>
    <h2>Workspace</h2>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-label">Work</div>
    <div class="sidebar-item active" onclick="switchView('tasks',this)"><span class="icon">✓</span> Tasks</div>
    <div class="sidebar-item" onclick="switchView('meetings',this)"><span class="icon">◷</span> Meetings</div>
    <div class="sidebar-item" onclick="switchView('projects',this)"><span class="icon">◈</span> Projects</div>
  </div>
</aside>

<!-- Main -->
<main class="main">
  <header class="topbar">
    <div class="topbar-left">
      <div class="topbar-title" id="view-title">Tasks</div>
      <div class="topbar-date" id="today-date"></div>
    </div>
    <div class="topbar-right">
      <button class="btn" onclick="loadData()">↻ Refresh</button>
    </div>
  </header>
  <div class="content" id="content">
    <div class="loading"><div class="spinner"></div><p style="color:var(--text3);font-size:13px;">Loading workspace…</p></div>
  </div>
</main>

<!-- Bottom nav (mobile) -->
<nav class="bottom-nav">
  <div class="bottom-nav-inner">
    <div class="bottom-nav-item active" id="bnav-tasks" onclick="switchView('tasks',this,true)">
      <span class="nav-icon">✓</span><span class="nav-label">Tasks</span>
    </div>
    <div class="bottom-nav-item" id="bnav-meetings" onclick="switchView('meetings',this,true)">
      <span class="nav-icon">◷</span><span class="nav-label">Meetings</span>
    </div>
    <div class="bottom-nav-item" id="bnav-projects" onclick="switchView('projects',this,true)">
      <span class="nav-icon">◈</span><span class="nav-label">Projects</span>
    </div>
  </div>
</nav>

<!-- FAB (mobile) -->

<script>
let SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz1y3nI_x4wV0DGpWwcuKtpE2HAuGo3vlmDMdRiQe6tf-ijJBP9UVZqMeiy0uSfduhG/exec';
let currentView = 'tasks';
let allData = { tasks: [], meetings: [], projects: [] };
let modalMode = { type: '', action: 'add', row: null };

const today = new Date(); today.setHours(0,0,0,0);
function isoToday() { return today.toISOString().split('T')[0]; }
function fmtDate(str) { return str ? new Date(str+'T00:00:00').toLocaleDateString('en-NG',{month:'short',day:'numeric',year:'numeric'}) : ''; }
function isPast(str) { return str ? new Date(str+'T00:00:00') < today : false; }
function isToday(str) { return str ? str.startsWith(isoToday()) : false; }
function statusClass(s) {
  if (!s) return 'todo'; const sl = s.toLowerCase();
  if (sl.includes('done')||sl.includes('complete')) return 'done';
  if (sl.includes('progress')||sl.includes('active')) return 'inprog';
  if (sl.includes('plan')) return 'plan'; return 'todo';
}
function priorityClass(p) {
  if (!p) return 'med'; const pl = p.toLowerCase();
  if (pl.includes('high')) return 'high'; if (pl.includes('low')) return 'low'; return 'med';
}

async function loadData() {
  showLoading();
  try {
    const res = await fetch(SCRIPT_URL+'?action=all&t='+Date.now());
    const json = await res.json();
    if (json.status==='ok') { allData=json.data; renderView(currentView); }
    else showError('Could not load data. Check your Apps Script URL.');
  } catch(e) { showError('Failed to connect. Make sure your web app is deployed and accessible.'); }
}
function showLoading() { document.getElementById('content').innerHTML=`<div class="loading"><div class="spinner"></div><p style="color:var(--text3);font-size:13px;">Loading…</p></div>`; }
function showError(msg) { document.getElementById('content').innerHTML=`<div class="empty"><p style="color:#c0392b;font-size:14px;">⚠ ${msg}</p></div>`; }

const viewTitles = { tasks:'Tasks', meetings:'Meetings', projects:'Projects' };

function switchView(view, el, isMobile) {
  currentView = view;
  document.querySelectorAll('.sidebar-item').forEach(i=>i.classList.remove('active'));
  document.querySelectorAll('.bottom-nav-item').forEach(i=>i.classList.remove('active'));
  if (isMobile) {
    document.getElementById('bnav-'+view)?.classList.add('active');
    document.querySelectorAll('.sidebar-item').forEach(i=>{ if(i.textContent.trim().toLowerCase().includes(view.slice(0,-1)||view)) i.classList.add('active'); });
  } else {
    if (el) el.classList.add('active');
    document.getElementById('bnav-'+view)?.classList.add('active');
  }
  document.getElementById('view-title').textContent = viewTitles[view];
  renderView(view);
}

function renderView(view) {
  if (view==='tasks') renderTasks();
  else if (view==='meetings') renderMeetings();
  else if (view==='projects') renderProjects();
}

function renderTasks(filter='all', search='') {
  let tasks = [...allData.tasks];
  if (filter!=='all') tasks = tasks.filter(t=>statusClass(t.status)===filter);
  if (search) tasks = tasks.filter(t=>t.title.toLowerCase().includes(search.toLowerCase())||(t.project||'').toLowerCase().includes(search.toLowerCase()));
  document.getElementById('content').innerHTML = `
    <div class="filter-bar">
      <input class="search-input" placeholder="Search tasks…" oninput="renderTasks(getActiveFilter('tf'),this.value)" value="${esc(search)}" />
      ${['all','inprog'].map(f=>`<button class="filter-btn ${filter===f?'active':''}" id="tf-${f}" onclick="setFilter('tf','${f}',renderTasks)">${f==='all'?'All':f==='inprog'?'In Progress'}</button>`).join('')}
    </div>
    <div class="section-header"><span class="section-title">Tasks</span><span class="section-count">${tasks.length}</span></div>
    <div class="task-list">${tasks.length?tasks.map(taskRow).join(''):'<div class="empty">No tasks found</div>'}</div>`;
}



function renderMeetings(filter='all', search='') {
  let meetings = [...allData.meetings].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  if (filter==='upcoming') meetings = meetings.filter(m=>!isPast(m.date)||isToday(m.date));
  if (search) meetings = meetings.filter(m=>m.title.toLowerCase().includes(search.toLowerCase()));
  document.getElementById('content').innerHTML = `
    <div class="filter-bar">
      <input class="search-input" placeholder="Search meetings…" oninput="renderMeetings(getActiveFilter('mf'),this.value)" value="${esc(search)}" />
      ${['all','upcoming'].map(f=>`<button class="filter-btn ${filter===f?'active':''}" id="mf-${f}" onclick="setFilter('mf','${f}',renderMeetings)">${f==='all'?'All':'Upcoming'}</button>`).join('')}
    </div>
    <div class="section-header"><span class="section-title">Meetings</span><span class="section-count">${meetings.length}</span></div>
    <div class="meeting-list">${meetings.length?meetings.map(meetingRow).join(''):'<div class="empty">No meetings found</div>'}</div>`;
}

function meetingRow(m) {
  return `<div class="meeting-row">
    <div class="meeting-time-col"><div class="meeting-time">${esc(m.time)}</div><div class="meeting-date-sm">${fmtDate(m.date)}</div></div>
    <div class="meeting-divider"></div>
    <div class="meeting-body">
      <div class="meeting-title">${esc(m.title)}</div>
      <div class="meeting-meta">
        ${m.attendees?`<span>👤 ${esc(m.attendees)}</span>`:''}
        ${m.location?`<span>📍 ${esc(m.location)}</span>`:''}
        ${m.notes?`<span>${esc(m.notes.slice(0,60))}${m.notes.length>60?'…':''}</span>`:''}
      </div>
    </div>
  </div>`;
}

function renderProjects(filter='all') {
  let projects = [...allData.projects];
  if (filter!=='all') projects = projects.filter(p=>statusClass(p.status)===filter);
  document.getElementById('content').innerHTML = `
    <div class="filter-bar">
      ${['all','inprog','plan','done'].map(f=>`<button class="filter-btn ${filter===f?'active':''}" onclick="renderProjects('${f}')">${f==='all'?'All':f==='inprog'?'In Progress':f.charAt(0).toUpperCase()+f.slice(1)}</button>`).join('')}
    </div>
    <div class="section-header"><span class="section-title">Projects</span><span class="section-count">${projects.length}</span></div>
    <div class="project-grid">${projects.length?projects.map(projectCard).join(''):'<div class="empty">No projects found</div>'}</div>`;
}

function projectCard(p) {
  const pct = Math.min(100,Math.max(0,Number(p.progress)||0));
  return `<div class="project-card">
    <div class="project-card-top"><div class="project-name">${esc(p.title)}</div>${badge(p.status)}</div>
    <div class="project-desc">${esc(p.update||'')}</div>
    <div>
      <div style="display:flex;justify-content:space-between;margin-bottom:5px;">
        <span style="font-size:11px;color:var(--text3);">Progress</span>
        <span style="font-size:11px;color:var(--text2);font-weight:500;">${pct}%</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="project-footer"><div class="project-deadline">${p.deadline?'🗓 '+fmtDate(p.deadline):''}</div></div>
  </div>`;
}

function badge(val,isPriority=false) {
  if (!val) return '';
  const cls = isPriority?priorityClass(val):statusClass(val);
  const label = val.length>16?val.slice(0,14)+'…':val;
  return `<span class="tag ${cls}">${esc(label)}</span>`;
}
function getActiveFilter(prefix) {
  const a = document.querySelector(`[id^="${prefix}-"].active`);
  return a ? a.id.replace(prefix+'-','') : 'all';
}
function setFilter(prefix,val,renderFn) {
  document.querySelectorAll(`[id^="${prefix}-"]`).forEach(b=>b.classList.remove('active'));
  document.getElementById(`${prefix}-${val}`)?.classList.add('active');
  const s = document.querySelector('.search-input');
  renderFn(val, s?s.value:'');
}

async function toggleTaskDone(row,isDone) {
  const task = allData.tasks.find(t=>t._row===row); if (!task) return;
  task.status = isDone?'Not Started':'Done';
  renderView(currentView);
  await postData({type:'tasks',action:'update',row,values:[task.date,task.title,task.status,task.priority,task.project,task.notes]});
}


function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

(function init() {
  document.getElementById('today-date').textContent = new Date().toLocaleDateString('en-NG',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  loadData();
})();
</script>
